<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef1ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111816" media="(prefers-color-scheme: dark)">
    <title>Local Time</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-shell">
        <header class="intro">
            <p class="eyebrow">A quiet instrument for the present</p>
            <h1>Local time<span aria-hidden="true">.</span></h1>
            <p class="intro-copy">One glance. No clutter. Just the exact moment, moving with you.</p>
        </header>

        <div class="time-stage">
        <div class="analog-clock" aria-label="Analog clock background">
            <div class="clock-face">
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="hand second-hand" id="secondHand"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <section class="glass-panel" aria-label="Current local time">
            <div class="badge"><span class="status-dot" aria-hidden="true"></span>Live now</div>
            <div class="clock-wrap">
                <time class="clock" id="clock" aria-live="polite" aria-atomic="true"></time>
            </div>
            <time class="date" id="date"></time>
            <p class="local-note">Your device's local time</p>
        </section>
        </div>
    </main>

    <script>
        let previousSecondDeg = null;
        let secondRotation = 0;

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const displayHours = hours % 12 || 12;
            const meridiem = hours >= 12 ? 'PM' : 'AM';
            const timeString = [displayHours, minutes, seconds]
                .map((value) => String(value).padStart(2, '0'))
                .join(':');
            const clockEl = document.getElementById('clock');
            clockEl.textContent = timeString;
            clockEl.dataset.meridiem = meridiem;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dateString = `${days[now.getDay()]}, ${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            document.getElementById('date').textContent = dateString;

            const hourDeg = ((displayHours % 12) + minutes / 60 + seconds / 3600 + milliseconds / 3600000) * 30;
            const minuteDeg = (minutes + seconds / 60 + milliseconds / 60000) * 6;
            const secondDeg = (seconds + milliseconds / 1000) * 6;

            if (previousSecondDeg === null) {
                secondRotation = secondDeg;
            } else {
                let rotationDelta = secondDeg - previousSecondDeg;
                if (rotationDelta < -180) rotationDelta += 360;
                if (rotationDelta > 180) rotationDelta -= 360;
                secondRotation += rotationDelta;
            }
            previousSecondDeg = secondDeg;

            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
            document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${secondRotation}deg)`;

            requestAnimationFrame(updateClock);
        }

        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
