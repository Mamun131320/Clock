<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page-shell">
        <div class="analog-clock" aria-label="Analog clock background">
            <div class="clock-face">
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <span class="tick"></span>
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand minute-hand" id="minuteHand"></div>
                <div class="hand second-hand" id="secondHand"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <div class="glass-panel">
            <div class="badge">Live Time</div>
            <div class="clock-wrap">
                <div class="clock" id="clock"></div>
            </div>
            <div class="date" id="date"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            const displayHours = hours % 12 || 12;
            const meridiem = hours >= 12 ? 'PM' : 'AM';
            const timeString = [displayHours, minutes, seconds]
                .map((value) => String(value).padStart(2, '0'))
                .join(':');
            const clockEl = document.getElementById('clock');
            clockEl.textContent = timeString;
            clockEl.dataset.meridiem = meridiem;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dateString = `${days[now.getDay()]}, ${now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            document.getElementById('date').textContent = dateString;

            const hourDeg = ((displayHours % 12) + minutes / 60 + seconds / 3600 + milliseconds / 3600000) * 30;
            const minuteDeg = (minutes + seconds / 60 + milliseconds / 60000) * 6;
            const secondDeg = (seconds + milliseconds / 1000) * 6;

            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
            document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;

            requestAnimationFrame(updateClock);
        }

        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
